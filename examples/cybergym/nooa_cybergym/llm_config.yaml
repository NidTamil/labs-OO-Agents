# SunChaser DeepSeek V4 Flash pilot configuration.
# Run with NOOA_CYBERGYM_REASONING_EFFORT=max.
models:
  glm-5.2:
    model_name: openai/deepseek-v4-flash
    api_base: https://api.deepseek.com/v1
    api_key_env: OPENAI_API_KEY
    context_window: 1000000
    max_tokens: 384000

  nvidia/nemotron-3-ultra:
    model_name: openai/deepseek-v4-flash
    api_base: https://api.deepseek.com/v1
    api_key_env: OPENAI_API_KEY
    context_window: 1000000
    max_tokens: 384000

  deepseek-v4-flash:
    model_name: openai/deepseek-v4-flash
    api_base: https://api.deepseek.com/v1
    api_key_env: OPENAI_API_KEY
    context_window: 1000000
    max_tokens: 384000

  # Task 13 diagnostic route. Keep this alias separate from Flash so the
  # diagnostic can assert the exact official DeepSeek model it selected.
  deepseek-v4-pro:
    model_name: openai/deepseek-v4-pro
    api_base: https://api.deepseek.com/v1
    api_key_env: OPENAI_API_KEY
    context_window: 1000000
    max_tokens: 384000
    reasoning_effort: max
    allowed_openai_params:
      - reasoning_effort

  # Alternate SunChaser v2 reviewer. This is the GLM Coding Plan endpoint,
  # separate from the pay-as-you-go general API. Z.AI exposes deep thinking as
  # enabled/disabled rather than an effort tier; enabled is the maximum mode.
  glm-5.3:
    model_name: openai/glm-5.3
    api_base: https://api.z.ai/api/coding/paas/v4
    api_key_env: ANTHROPIC_AUTH_TOKEN
    context_window: 200000
    max_tokens: 32768
    extra_body:
      thinking:
        type: enabled
        clear_thinking: true

  # Alternate diagnostic reviewer. Keep its endpoint and credential provider
  # scoped so neither can fall back to a worker's DeepSeek settings.
  kimi-k3:
    model_name: openai/kimi-k3
    api_base: https://api.moonshot.ai/v1
    api_key_env: KIMI_API_KEY
    context_window: 1000000
    max_tokens: 32768
    reasoning_effort: max
    allowed_openai_params:
      - reasoning_effort
